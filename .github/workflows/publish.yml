name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (workflow_dispatch only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-distributions:
    name: Build distributions (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: wsba_hockey-windows
          - platform: linux
            os: ubuntu-latest
            artifact: wsba_hockey-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: build-distributions
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip twine

      - name: Verify PyPI token secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: PYPI_API_TOKEN"
            exit 1
          fi
          case "$PYPI_API_TOKEN" in
            pypi-*) ;;
            *)
              echo "::error::PYPI_API_TOKEN must be the full PyPI API token beginning with pypi-"
              exit 1
              ;;
          esac

      - name: Download Linux distributions
        uses: actions/download-artifact@v4
        with:
          name: wsba_hockey-linux
          path: dist

      - name: Check downloaded distributions
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  docs-build:
    needs: pypi
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .

      - name: Clean previous builds
        run: |
          rm -rf docs/build

      - name: Generate API docs (autodoc)
        run: |
          rm -rf docs/source/api
          python -m sphinx.ext.apidoc -f -o docs/source/api src/wsba_hockey src/wsba_hockey/tools/archive src/wsba_hockey/tools/__pycache__

      - name: Build Sphinx HTML
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  docs-deploy:
    needs: docs-build
    if: always() && needs.docs-build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
