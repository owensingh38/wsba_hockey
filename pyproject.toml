[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsba_hockey"
version = "1.6.0"
authors = [
  { name="Owen Singh", email="owenbksingh@gmail.com" },
]
description = "WeakSide Breakout's complete Python package of access to hockey data, primairly including the scraping of National Hockey League schedule, play-by-play, and shifts information."
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "beautifulsoup4>=4.12",
    "hockey-rink>=1.1",
    "networkx>=3.0"
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["wsba","hockey","scraping","NHL","analytics"]

[project.urls]
Homepage = "https://github.com/owensingh38/wsba_hockey/"
Documentation = "https://weakside-breakout-analysis.github.io/wsba_hockey/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.exclude-package-data]
wsba_hockey = [
    "api/*",
    "aws_pbp/*",
    "pbp/*",
    "sources/*",
    "stats/*",
    "evidence/*",
    "flask/*",
    "__pycache__/*",
    "_vscode/*",
    ".gitattributes"
]
