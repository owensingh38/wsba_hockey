[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsba_hockey"
version = "1.7.0"
authors = [
  { name="Owen Singh", email="owenbksingh@gmail.com" },
]
description = "WeakSide Breakout's Python package for hockey data, primarily including National Hockey League schedule, play-by-play, roster, standings, and shift information."
dependencies = [
    "numpy>=1.23",
    "polars>=1.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "beautifulsoup4>=4.12",
    "hockey-rink>=1.1",
    "networkx>=3.0"
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["wsba","hockey","scraping","NHL","analytics"]

[project.urls]
Homepage = "https://github.com/owensingh38/wsba_hockey/"
Documentation = "https://weakside-breakout-analysis.github.io/wsba_hockey/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["wsba_hockey.tools.legacy*"]

[tool.setuptools.package-data]
wsba_hockey = [
    "tools/rosters/*.csv",
    "tools/schedule/*.csv",
    "tools/teaminfo/*.csv",
    "tools/utils/*.png",
    "xg_model/*.json",
    "xg_model/legacy/*.json",
]

[tool.setuptools.exclude-package-data]
wsba_hockey = [
    "api/*",
    "aws_pbp/*",
    "pbp/*",
    "sources/*",
    "stats/*",
    "evidence/*",
    "flask/*",
    "tools/legacy/*",
    "tools/legacy/**",
    "__pycache__/*",
    "_vscode/*",
    ".gitattributes"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
